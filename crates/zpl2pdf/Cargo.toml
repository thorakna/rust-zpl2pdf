[package]
name = "zpl2pdf"
description = "Native ZPL (Zebra Programming Language) to PDF and PNG converter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["raster"]
raster = ["dep:tiny-skia"]

[dependencies]
pdf-writer = "0.15"
subsetter = "0.2.6"
skrifa = "0.49"
rxing = { version = "0.9.3", default-features = false, features = ["encoding_rs", "encoders", "qrcode", "datamatrix", "pdf417", "aztec"] }
miniz_oxide = "0.9"
base64 = "0.23"
encoding_rs = "0.8"
thiserror = "2"
tiny-skia = { version = "0.12", optional = true }
png = "0.18"

[dev-dependencies]
insta = "1.49"
image = { version = "0.25", default-features = false, features = ["png"] }
proptest = "1.12"
rxing = { version = "0.9.3" }
