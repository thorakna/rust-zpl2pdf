[workspace]
resolver = "3"
members = ["crates/zpl2pdf", "crates/zpl2pdf-cli", "crates/zpl2pdf-server"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/thorakna/rust-zpl2pdf"

[workspace.dependencies]
zpl2pdf = { path = "crates/zpl2pdf" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
